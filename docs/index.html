<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Franchise Dynasty Football Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=d2e6cbe242">
</head>
<body>

<div id="boot">
  <div class="boot-shell">
    <section class="boot-hero" aria-label="Franchise Dynasty Football Sim">
      <h1><span>Franchise</span><span>Dynasty</span><span class="boot-title-sub">Football Sim</span></h1>
      <p class="boot-tagline">Build a team.<br>Define an era.</p>
    </section>
    <section class="boot-picker" aria-labelledby="boot-picker-title">
      <div class="boot-picker-head">
        <h2 id="boot-picker-title">Choose your team</h2>
        <div class="boot-selected" hidden aria-live="polite"><span class="boot-selected-code" id="selectedcode"></span><b id="selectedname"></b></div>
        <div class="boot-actions"><button class="boot-action primary" id="start" disabled>Start a Franchise</button><button class="boot-action" id="resume" disabled>Resume Saved Game</button></div>
      </div>
      <div class="boot-pick" id="pick" role="group" aria-label="Choose your team"></div>
      <div class="boot-progress"><div class="boot-bar" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bootbar"></i></div><div class="boot-line" id="bootline" role="status" aria-live="polite">Loading game…</div></div>
    </section>
  </div>
</div>

<header class="rail" id="rail" hidden>
  <div class="in rail-identity">
    <div class="hist"><button aria-label="Back" id="back">‹</button><button aria-label="Forward" disabled>›</button></div>
    <div class="club"><div class="crest" id="crest">KC</div><div><div class="name" id="clubname">—</div><div class="who" id="coach">—</div><div class="title" id="coachtitle">Head Coach and GM</div></div></div>

    <div class="status">
      <div class="stat"><b id="st-record">0–0</b><span id="st-place">—</span></div>
      <div class="stat"><b id="st-cap">—</b><span>Cap Space</span></div>
      <div class="stat"><b id="st-prestige">—</b><span>Prestige</span></div>
      <div class="stat"><b id="st-week">—</b><span id="st-year">—</span></div>
    </div>
    <button class="advance" id="advance"><div class="txt"><span id="adv-title">Advance</span><small id="adv-sub"></small></div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 5l10 7-10 7z"/></svg></button>
  </div>
  <div class="rail-navigation"><div class="in">    <nav id="nav">
      <a href="#portal" data-page="portal" aria-current="page">Portal <span class="badge" id="badge" hidden>0</span></a><a href="#club" data-page="club">Team</a><a href="#personnel" data-page="personnel">Personnel</a><a href="#draft" data-page="draft">Draft</a><a href="#league" data-page="league">League</a><a href="#gameplan" data-page="gameplan">Game Plan</a><a href="#gameday" data-page="gameday">Game Day</a><a href="#frontoffice" data-page="frontoffice">Front Office</a>
    </nav><div class="rail-utilities"><button class="kbd" id="save" aria-label="Save" data-tip="Save to this browser">Save</button><button class="kbd" id="export" aria-label="Export" data-tip="Export the save as a file">Export</button><button class="kbd" id="import" aria-label="Import" data-tip="Import a save file">Import</button><input type="file" id="importfile" accept=".json,application/json" hidden>      <details class="quick-menu"><summary>Quick Links</summary><div class="quick-links"><a href="#club">Roster</a><a href="#club/depth">Depth Chart</a><a href="#frontoffice/cap">Cap</a><a href="#personnel/wire">Wire</a><a href="#league">Standings</a></div></details></div></div></div>
  <div class="sub">
    <div class="in">
      <div class="crumb" id="crumb">Portal</div>
      <div class="second" id="second"></div>

    </div>
  </div>
</header>

<section class="action-feedback" id="action-feedback" hidden aria-label="Action error">
  <div id="action-feedback-text" role="alert"></div>
  <button class="btn quiet" id="dismiss-feedback" type="button">Dismiss</button>
</section>
<main id="page" hidden></main>

<script type="module" src="app.js?v=d2e6cbe242"></script>
</body>
</html>
